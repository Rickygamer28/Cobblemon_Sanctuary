name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve versions
        timeout-minutes: 5
        run: |
          set -u
          latest() { grep -oP "<version>$1</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1; }
          NEO=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | latest '21\.1\.\d+')
          MDG=$(curl -fsSL https://plugins.gradle.org/m2/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml | latest '2\.0\.\d+')
          curl -fsSL 'https://api.modrinth.com/v2/project/cobblemon/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D' > cobblemon-versions.json
          COBBLE=$(jq -r '[.[] | select(.version_number | test("1\\.8\\.4"))][0].id' cobblemon-versions.json)
          COBBLE_NAME=$(jq -r '[.[] | select(.version_number | test("1\\.8\\.4"))][0].version_number' cobblemon-versions.json)
          COBBLE_URL=$(jq -r '[.[] | select(.version_number | test("1\\.8\\.4"))][0].files[0].url' cobblemon-versions.json)
          echo "COBBLE_URL=$COBBLE_URL" >> "$GITHUB_ENV"
          echo "NEO=$NEO" >> "$GITHUB_ENV"
          echo "MDG=$MDG" >> "$GITHUB_ENV"
          echo "COBBLE=$COBBLE" >> "$GITHUB_ENV"
          # Fabric
          FMETA=https://maven.fabricmc.net
          LOOM=$(curl -fsSL $FMETA/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml | latest '1\.1[01]\.\d+')
          FAPI=$(curl -fsSL $FMETA/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | latest '0\.\d+\.\d+\+1\.21\.1')
          FLK=$(curl -fsSL $FMETA/net/fabricmc/fabric-language-kotlin/maven-metadata.xml | latest '\d+\.\d+\.\d+\+kotlin\.2\.2\.\d+')
          FLOADER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader/1.21.1 | jq -r '[.[] | select(.loader.stable)][0].loader.version')
          FINSTALLER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | jq -r '[.[] | select(.stable)][0].version')
          curl -fsSL 'https://api.modrinth.com/v2/project/cobblemon/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.1%22%5D' > cobblemon-fabric-versions.json
          COBBLE_F=$(jq -r '[.[] | select(.version_number | test("1\\.8\\.4"))][0].id' cobblemon-fabric-versions.json)
          COBBLE_F_URL=$(jq -r '[.[] | select(.version_number | test("1\\.8\\.4"))][0].files[0].url' cobblemon-fabric-versions.json)
          curl -fsSL 'https://api.modrinth.com/v2/project/forge-config-api-port/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.1%22%5D' > fcap-versions.json
          FCAP=$(jq -r '.[0].id' fcap-versions.json)
          # Cobblemon Expeditions (optional compatibility), one build per loader
          EXP_N=$(curl -fsSL 'https://api.modrinth.com/v2/project/HtRy1shF/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D' | jq -r '.[0].id')
          EXP_F=$(curl -fsSL 'https://api.modrinth.com/v2/project/HtRy1shF/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.1%22%5D' | jq -r '.[0].id')
          for v in LOOM FAPI FLK FLOADER FINSTALLER COBBLE_F COBBLE_F_URL FCAP EXP_N EXP_F; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
          mkdir -p ci-out
          {
            echo "neoforge=$NEO"
            echo "moddev=$MDG"
            echo "cobblemon_modrinth_id=$COBBLE"
            echo "cobblemon_version=$COBBLE_NAME"
            echo "loom=$LOOM fabric_api=$FAPI fabric_kotlin=$FLK fabric_loader=$FLOADER installer=$FINSTALLER"
            echo "cobblemon_fabric=$COBBLE_F fcap=$FCAP ($(jq -r '.[0].version_number' fcap-versions.json))"
            echo "recent cobblemon neoforge versions:"
            jq -r '.[0:8][] | "  \(.version_number)  \(.id)"' cobblemon-versions.json
          } | tee ci-out/versions.txt

      - name: Dump Cobblemon API
        if: hashFiles('.ci/dump-api') != ''
        timeout-minutes: 15
        run: bash .ci/dump-api.sh ci-out/api

      - name: Build
        id: build
        timeout-minutes: 40
        run: |
          set +e
          timeout 35m ./gradlew build --continue --stacktrace --console=plain --no-daemon -Pneo_version="$NEO" -Pmoddev_version="$MDG" -Pcobblemon_version="$COBBLE" \
            -Ploom_version="$LOOM" -Pfabric_api_version="$FAPI" -Pfabric_kotlin_version="$FLK" -Pfabric_loader_version="$FLOADER" \
            -Pcobblemon_fabric_version="$COBBLE_F" -Pfcap_version="$FCAP" \
            -Pexpeditions_neoforge_version="$EXP_N" -Pexpeditions_fabric_version="$EXP_F" > ci-out/build.log 2>&1
          STATUS=$?
          echo "$STATUS" > ci-out/status.txt
          tail -80 ci-out/build.log
          { grep -E "^e: |error:|warning:.*deprecated" ci-out/build.log | head -200; grep -A12 "What went wrong" ci-out/build.log | head -60; } > ci-out/errors.txt || true
          mkdir -p ci-out/jar
          cp neoforge/build/libs/*.jar fabric/build/libs/*.jar ci-out/jar/ 2>/dev/null || true
          rm -f ci-out/jar/*-sources.jar
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Self test (real servers, NeoForge and Fabric, build a valley and check it)
        # only for big updates: when the commit message asks for it with [selftest]
        if: steps.build.outputs.status == '0' && contains(github.event.head_commit.message, '[selftest]')
        timeout-minutes: 50
        run: |
          set +e
          SIZE=$(cat .ci/selftest | head -1)
          ROOT=$PWD
          props() { echo "eula=true" > eula.txt; printf 'server-port=%s\nonline-mode=false\nmax-tick-time=-1\nspawn-protection=0\nlevel-type=minecraft\\:flat\nview-distance=4\nsimulation-distance=4\ngenerate-structures=false\n' "$1" > server.properties; }
          finish() { # $1 = output dir
            cp selftest-report.txt "$1/" 2>/dev/null || echo "no report" > "$1/selftest-report.txt"
            grep -E "selftest|Sanctuary|ERROR|Exception" "$1/server.log" | head -300 > "$1/highlights.txt"
            tail -200 "$1/server.log" > "$1/server-tail.log"
            rm -f "$1/server.log"
          }
          neo_test() {
            OUT=$ROOT/ci-out/selftest; mkdir -p ci-test-neo/mods "$OUT"; cd ci-test-neo
            curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$NEO/neoforge-$NEO-installer.jar"
            java -jar installer.jar --installServer > "$OUT/install.log" 2>&1
            curl -fsSL -o mods/cobblemon.jar "$COBBLE_URL"
            KFF_URL=$(curl -fsSL 'https://api.modrinth.com/v2/project/kotlin-for-forge/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D' | jq -r '.[0].files[0].url')
            curl -fsSL -o mods/kotlinforforge.jar "$KFF_URL"
            # other mods we're compatible with, to check the mod starts cleanly beside them
            curl -fsSL -o mods/cobblemon-expeditions.jar "$(curl -fsSL "https://api.modrinth.com/v2/version/$EXP_N" | jq -r '.files[0].url')" || true
            cp "$ROOT"/neoforge/build/libs/*.jar mods/; rm -f mods/*-sources.jar
            ls -la mods > "$OUT/mods.txt"; props 25565
            printf '\n-Xmx4G\n-Dsanctuary.selftest=%s\n' "$SIZE" >> user_jvm_args.txt
            timeout 42m ./run.sh nogui > "$OUT/server.log" 2>&1
            echo "exit=$?" > "$OUT/exit.txt"; finish "$OUT"
          }
          fabric_test() {
            OUT=$ROOT/ci-out/selftest-fabric; mkdir -p ci-test-fabric/mods "$OUT"; cd ci-test-fabric
            curl -fsSL -o fabric-server.jar "https://meta.fabricmc.net/v2/versions/loader/1.21.1/$FLOADER/$FINSTALLER/server/jar"
            curl -fsSL -o mods/cobblemon.jar "$COBBLE_F_URL"
            curl -fsSL -o mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$FAPI/fabric-api-$FAPI.jar"
            curl -fsSL -o mods/fabric-language-kotlin.jar "https://maven.fabricmc.net/net/fabricmc/fabric-language-kotlin/$FLK/fabric-language-kotlin-$FLK.jar"
            curl -fsSL -o mods/cobblemon-expeditions.jar "$(curl -fsSL "https://api.modrinth.com/v2/version/$EXP_F" | jq -r '.files[0].url')" || true
            cp "$ROOT"/fabric/build/libs/*.jar mods/; rm -f mods/*-sources.jar
            ls -la mods > "$OUT/mods.txt"; props 25566
            timeout 42m java -Xmx4G -Dsanctuary.selftest="$SIZE" -jar fabric-server.jar nogui > "$OUT/server.log" 2>&1
            echo "exit=$?" > "$OUT/exit.txt"; finish "$OUT"
          }
          ( neo_test ) &
          ( fabric_test ) &
          wait

      - name: Publish results to ci-output branch
        if: always()
        timeout-minutes: 5
        run: |
          cd ci-out
          echo "${GITHUB_SHA}" > commit.txt
          git init -q
          git config user.name "sanctuary-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-output

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.status == '0'
        with:
          name: cobblemon-sanctuary-jar
          path: |
            neoforge/build/libs/*.jar
            fabric/build/libs/*.jar

      - name: Fail if build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
