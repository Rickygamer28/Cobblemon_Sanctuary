name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve versions
        timeout-minutes: 5
        run: |
          set -u
          latest() { grep -oP "<version>$1</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1; }
          NEO=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | latest '21\.1\.\d+')
          MDG=$(curl -fsSL https://plugins.gradle.org/m2/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml | latest '2\.0\.\d+')
          curl -fsSL 'https://api.modrinth.com/v2/project/cobblemon/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D' > cobblemon-versions.json
          COBBLE=$(jq -r '[.[] | select(.version_number | test("1\\.8\\.4"))][0].id' cobblemon-versions.json)
          COBBLE_NAME=$(jq -r '[.[] | select(.version_number | test("1\\.8\\.4"))][0].version_number' cobblemon-versions.json)
          COBBLE_URL=$(jq -r '[.[] | select(.version_number | test("1\\.8\\.4"))][0].files[0].url' cobblemon-versions.json)
          echo "COBBLE_URL=$COBBLE_URL" >> "$GITHUB_ENV"
          echo "NEO=$NEO" >> "$GITHUB_ENV"
          echo "MDG=$MDG" >> "$GITHUB_ENV"
          echo "COBBLE=$COBBLE" >> "$GITHUB_ENV"
          mkdir -p ci-out
          {
            echo "neoforge=$NEO"
            echo "moddev=$MDG"
            echo "cobblemon_modrinth_id=$COBBLE"
            echo "cobblemon_version=$COBBLE_NAME"
            echo "recent cobblemon neoforge versions:"
            jq -r '.[0:8][] | "  \(.version_number)  \(.id)"' cobblemon-versions.json
          } | tee ci-out/versions.txt

      - name: Dump Cobblemon API
        if: hashFiles('.ci/dump-api') != ''
        timeout-minutes: 15
        run: bash .ci/dump-api.sh ci-out/api

      - name: Build
        id: build
        timeout-minutes: 40
        run: |
          set +e
          timeout 35m ./gradlew build --stacktrace --console=plain --no-daemon -Pneo_version="$NEO" -Pmoddev_version="$MDG" -Pcobblemon_version="$COBBLE" > ci-out/build.log 2>&1
          STATUS=$?
          echo "$STATUS" > ci-out/status.txt
          tail -80 ci-out/build.log
          grep -E "^e: |error:|warning:.*deprecated" ci-out/build.log | head -200 > ci-out/errors.txt || true
          mkdir -p ci-out/jar
          cp build/libs/*.jar ci-out/jar/ 2>/dev/null || true
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Self test (real server builds a valley and checks it)
        if: steps.build.outputs.status == '0' && hashFiles('.ci/selftest') != ''
        timeout-minutes: 45
        run: |
          set +e
          SIZE=$(cat .ci/selftest | head -1)
          mkdir -p ci-test/mods ci-out/selftest
          cd ci-test
          curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$NEO/neoforge-$NEO-installer.jar"
          java -jar installer.jar --installServer > ../ci-out/selftest/install.log 2>&1
          curl -fsSL -o mods/cobblemon.jar "$COBBLE_URL"
          KFF_URL=$(curl -fsSL 'https://api.modrinth.com/v2/project/kotlin-for-forge/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D' | jq -r '.[0].files[0].url')
          curl -fsSL -o mods/kotlinforforge.jar "$KFF_URL"
          cp ../build/libs/*.jar mods/ 2>/dev/null
          rm -f mods/*-sources.jar
          ls -la mods > ../ci-out/selftest/mods.txt
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nmax-tick-time=-1\nspawn-protection=0\nlevel-type=minecraft\\:flat\nview-distance=4\nsimulation-distance=4\ngenerate-structures=false\n' > server.properties
          echo "-Xmx4G -Dsanctuary.selftest=$SIZE" >> user_jvm_args.txt
          timeout 40m ./run.sh nogui > ../ci-out/selftest/server.log 2>&1
          echo "exit=$?" > ../ci-out/selftest/exit.txt
          cp selftest-report.txt ../ci-out/selftest/ 2>/dev/null || echo "no report" > ../ci-out/selftest/selftest-report.txt
          grep -E "selftest|ERROR|Exception" ../ci-out/selftest/server.log | head -300 > ../ci-out/selftest/highlights.txt
          tail -200 ../ci-out/selftest/server.log > ../ci-out/selftest/server-tail.log
          rm -f ../ci-out/selftest/server.log

      - name: Publish results to ci-output branch
        if: always()
        timeout-minutes: 5
        run: |
          cd ci-out
          echo "${GITHUB_SHA}" > commit.txt
          git init -q
          git config user.name "sanctuary-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-output

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.status == '0'
        with:
          name: cobblemon-sanctuary-jar
          path: build/libs/*.jar

      - name: Fail if build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
